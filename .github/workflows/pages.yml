name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Use current Node.js
        uses: actions/setup-node@main
        with:
          node-version: current

      - name: Install dependencies
        run: npm install

      - name: Install current Pandoc
        run: sudo node scripts/install-latest-pandoc.mjs

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress pdfgrep poppler-utils python3-venv
          sudo python3 -m venv /opt/docxquisite
          sudo /opt/docxquisite/bin/pip install --quiet git+https://gitlab.com/Joao-O-Santos/docxquisite.git
          sudo ln -sf /opt/docxquisite/bin/docxquisite /usr/local/bin/docxquisite
          command -v docxquisite pdftotext pdfgrep libreoffice
          pdftotext -v
          pdfgrep --version
          libreoffice --version

      - name: Verify
        run: make verify

      - name: Build site
        run: make site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@main

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
