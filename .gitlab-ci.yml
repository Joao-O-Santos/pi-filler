image: node:current-bookworm

stages:
  - verify
  - pages
  - release

before_script:
  - npm install
  - node scripts/install-latest-pandoc.mjs
  - pandoc --version

verify:
  stage: verify
  script:
    - make verify

pages:
  stage: pages
  needs: [verify]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - make site
  artifacts:
    paths:
      - public

publish-npm:
  stage: release
  needs: [verify]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm install --global npm@latest
    - |
      package_version="$(node -p 'require("./package.json").version')"
      test "$CI_COMMIT_TAG" = "v${package_version}"
    - make verify
    - npm publish --provenance
